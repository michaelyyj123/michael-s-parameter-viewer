<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-Parameter Viewer</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;
  --text:#e2e8f0;--text2:#c9d1d9;--text3:#8b949e;--text4:#484f58;
  --accent:#58a6ff;--green:#3fb950;--red:#f85149;
}
body.light{
  --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;
  --text:#1f2328;--text2:#24292f;--text3:#57606a;--text4:#8c959f;
  --accent:#0969da;--green:#1a7f37;--red:#cf222e;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}

/* pages */
.page{display:none;flex-direction:column;height:100vh}
.page.active{display:flex}
#page-landing{align-items:center;justify-content:center;gap:32px}

/* landing */
.landing-title{font-size:1.9rem;font-weight:700;color:var(--accent);letter-spacing:-.5px}
.landing-sub{font-size:.9rem;color:var(--text3);margin-top:-22px}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:42px 70px;text-align:center;
  cursor:pointer;background:var(--bg2);transition:all .18s;max-width:520px;width:100%}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 4%,var(--bg2))}
.dz-title{font-size:.95rem;font-weight:500;margin-bottom:6px}
.dz-hint{font-size:.78rem;color:var(--text3)}
.drop-zone input{display:none}

/* header */
.pg-header{background:var(--bg2);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;min-height:48px}

/* tab bar */
.tab-bar{display:flex;gap:4px;flex:1;overflow-x:auto;align-items:center;min-width:0}
.tab-bar::-webkit-scrollbar{height:3px}
.tab-bar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tab{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 12px;
  background:var(--bg3);border:1px solid var(--border);border-radius:5px;
  cursor:pointer;font-size:.78rem;color:var(--text3);
  transition:all .12s;white-space:nowrap;max-width:200px;flex-shrink:0}
.tab:hover:not(.active){border-color:var(--text4);color:var(--text2)}
.tab.active{background:color-mix(in srgb,var(--accent) 11%,var(--bg3));
  border-color:var(--accent);color:var(--text2)}
.tab-name{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;max-width:130px}
.tab-badge{font-size:.62rem;background:var(--bg);border:1px solid var(--border);
  color:var(--text4);padding:1px 5px;border-radius:3px;flex-shrink:0}
.tab.active .tab-badge{background:var(--accent);border-color:var(--accent);
  color:#fff;font-weight:600}
.tab-close{background:transparent;border:none;color:var(--text4);cursor:pointer;
  font-size:.82rem;line-height:1;padding:2px 3px;flex-shrink:0;border-radius:3px;
  transition:all .12s;margin-left:2px}
.tab-close:hover{color:var(--red);background:color-mix(in srgb,var(--red) 15%,transparent)}

/* tab panels */
#tab-panels{flex:1;min-height:0;display:flex}
.tab-panel{display:none;flex:1;min-height:0;padding:16px;
  flex-direction:column;gap:12px;overflow-y:auto}
.tab-panel.active{display:flex}

/* add-file label */
.btn-add{background:var(--bg3);border:1px dashed var(--border);border-radius:5px;
  color:var(--text3);cursor:pointer;font-size:.78rem;padding:4px 10px;
  transition:all .12s;white-space:nowrap;flex-shrink:0}
.btn-add:hover{border-color:var(--accent);color:var(--accent)}

/* error */
.err-box{display:none;background:color-mix(in srgb,var(--red) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--red) 40%,transparent);
  border-radius:6px;padding:8px 14px;color:var(--red);font-size:.84rem}
.err-box.on{display:block}

/* info bar */
.info-bar{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:10px 18px;flex-wrap:wrap;gap:22px;font-size:.82rem;align-items:center}
.ii{display:flex;flex-direction:column;gap:1px}
.ii .lbl{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.ii .val{color:var(--accent);font-weight:600}

/* plots grid */
.plots-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plot-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  display:flex;flex-direction:column;overflow:hidden}
.plot-card-hdr{padding:9px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-shrink:0}
.pch-title{font-size:.85rem;font-weight:500;flex:1;color:var(--text2)}
.plot-div{height:400px}

/* smith selector */
.s-sel{display:flex;gap:3px}
.s-sel button{padding:2px 9px;font-size:.74rem;background:var(--bg3);border:1px solid var(--border);
  border-radius:4px;color:var(--text3);cursor:pointer;transition:all .12s}
.s-sel button.on,.s-sel button:hover{background:color-mix(in srgb,var(--accent) 15%,transparent);
  border-color:var(--accent);color:var(--accent)}

/* controls */
.ctrl-panel{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:14px 18px;flex-wrap:wrap;gap:18px;align-items:flex-start}
.cg{display:flex;flex-direction:column;gap:6px}
.cg-lbl{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.cg-row{display:flex;gap:6px;align-items:center}

input[type=number],select.cg-sel{background:var(--bg3);border:1px solid var(--border);border-radius:5px;
  padding:5px 9px;color:var(--text);font-size:.83rem;outline:none;transition:border-color .12s}
input[type=number]{width:96px}
select.cg-sel{cursor:pointer;width:auto}
input[type=number]:focus{border-color:var(--accent)}
input[type=number]::placeholder{color:var(--text4)}

/* buttons */
.btn{padding:5px 13px;border-radius:5px;font-size:.82rem;cursor:pointer;
  border:1px solid transparent;transition:all .14s;white-space:nowrap}
.btn-pri{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent);color:var(--accent)}
.btn-pri:hover{background:color-mix(in srgb,var(--accent) 25%,transparent)}
.btn-ghost{background:var(--bg3);border-color:var(--border);color:var(--text3)}
.btn-ghost:hover{border-color:var(--text3);color:var(--text2)}
.btn-back{background:var(--bg3);border-color:var(--border);color:var(--text2);
  padding:4px 11px;font-size:.8rem;flex-shrink:0}
.btn-back:hover{border-color:var(--text3)}
.btn-save{background:color-mix(in srgb,var(--green) 12%,transparent);border-color:var(--green);
  color:var(--green);padding:3px 9px;font-size:.74rem}
.btn-save:hover{background:color-mix(in srgb,var(--green) 22%,transparent)}
.btn-theme{background:var(--bg3);border-color:var(--border);color:var(--text3);
  padding:4px 11px;font-size:.78rem;flex-shrink:0}
.btn-theme:hover{border-color:var(--accent);color:var(--accent)}

/* y sliders */
.y-sliders{display:flex;flex-direction:column;gap:7px;min-width:220px}
.ys-row{display:flex;align-items:center;gap:8px}
.ys-lbl{font-size:.74rem;color:var(--text3);width:28px;text-align:right;flex-shrink:0}
.ys-val{font-size:.76rem;color:var(--accent);font-family:'Courier New',monospace;width:46px;
  text-align:right;flex-shrink:0}
.ys-unit{font-size:.7rem;color:var(--text4);flex-shrink:0}
input[type=range].ys-track{flex:1;height:4px;-webkit-appearance:none;appearance:none;
  background:var(--bg3);border-radius:2px;outline:none;cursor:pointer}
input[type=range].ys-track::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:grab;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
input[type=range].ys-track:active::-webkit-slider-thumb{cursor:grabbing}
input[type=range].ys-track::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);cursor:grab}

/* marker list */
.chart-hint{font-size:.73rem;color:var(--accent);padding:2px 0;font-style:italic}
.mkr-list{display:flex;flex-direction:column;gap:5px}
.mkr-row{display:flex;align-items:center;gap:10px;background:var(--bg2);
  border:1px solid var(--border);border-left-width:3px;border-radius:6px;
  padding:6px 10px;font-size:.81rem;cursor:pointer;transition:background .12s}
.mkr-row:hover{background:var(--bg3)}
.mkr-row.active{background:color-mix(in srgb,var(--accent) 7%,var(--bg2));
  border-top-color:color-mix(in srgb,var(--accent) 25%,var(--border));
  border-right-color:color-mix(in srgb,var(--accent) 25%,var(--border));
  border-bottom-color:color-mix(in srgb,var(--accent) 25%,var(--border))}
.mkr-color-inp{width:22px;height:22px;padding:1px;border:1px solid var(--border);
  border-radius:4px;cursor:pointer;background:none;flex-shrink:0;outline:none;
  transition:border-color .12s}
.mkr-color-inp:hover{border-color:var(--text3)}
.mkr-name-inp{background:transparent;border:1px solid transparent;border-radius:4px;
  color:var(--text2);font-size:.81rem;font-weight:600;
  width:58px;padding:2px 5px;outline:none;transition:all .12s;flex-shrink:0}
.mkr-name-inp:hover{border-color:var(--border)}
.mkr-name-inp:focus{border-color:var(--accent);background:var(--bg3)}
.mkr-freq-inp{background:transparent;border:1px solid transparent;border-radius:4px;
  color:var(--text2);font-family:'Courier New',monospace;font-size:.81rem;
  width:86px;padding:2px 5px;outline:none;transition:all .12s;flex-shrink:0}
.mkr-freq-inp:hover{border-color:var(--border)}
.mkr-freq-inp:focus{border-color:var(--accent);background:var(--bg3)}
.mkr-unit{font-size:.7rem;color:var(--text4);flex-shrink:0}
.mkr-snap{font-size:.73rem;color:var(--text3);flex-shrink:0;font-family:'Courier New',monospace}
.mkr-cursor-btn{background:transparent;border:1px solid var(--border);border-radius:4px;
  color:var(--text4);cursor:pointer;font-size:.72rem;padding:1px 6px;letter-spacing:.05em;
  transition:all .12s;flex-shrink:0}
.mkr-cursor-btn:hover{border-color:var(--text3);color:var(--text2)}
.mkr-cursor-btn.on{border-color:var(--accent);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent)}
.mkr-del{background:transparent;border:none;color:var(--text4);cursor:pointer;
  font-size:1.1rem;line-height:1;padding:0 3px;transition:color .12s;flex-shrink:0}
.mkr-del:hover{color:var(--red)}

@media(max-width:860px){.plots-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ════════ LANDING -->
<div id="page-landing" class="page active">
  <div style="position:absolute;top:16px;right:20px">
    <button class="btn btn-theme" onclick="toggleTheme()" id="tbtn-landing">Light mode</button>
  </div>
  <div class="landing-title">S-Parameter Viewer</div>
  <div class="landing-sub">Touchstone file reader &amp; plotter for RF engineering</div>
  <div class="drop-zone" id="dz-landing">
    <p class="dz-title">Drop .s1p / .s2p files here</p>
    <p class="dz-hint">or click to browse &nbsp;&middot;&nbsp; multiple files supported</p>
    <p class="dz-hint" style="margin-top:10px;color:var(--text4)">Files are processed locally in your browser and are not uploaded.</p>
    <input type="file" id="fi-landing" accept=".s1p,.s2p,.S1P,.S2P" multiple>
  </div>
</div>

<!-- ════════ VIEWER -->
<div id="page-viewer" class="page">
  <div class="pg-header">
    <button class="btn btn-back" onclick="goTo('landing')">&#8592; Back</button>
    <div class="tab-bar" id="tab-bar"></div>
    <label class="btn-add" for="fi-add">&#43; Add file</label>
    <input type="file" id="fi-add" accept=".s1p,.s2p,.S1P,.S2P" multiple style="display:none">
    <div style="margin-left:6px;flex-shrink:0">
      <button class="btn btn-theme" onclick="toggleTheme()" id="tbtn-viewer">Light mode</button>
    </div>
  </div>
  <div id="tab-panels"></div>
</div>

<script>
// ── state ─────────────────────────────────────────────────────────────────────
let _fid=0;
const S={files:[],active:0};
function fileById(id){return S.files.find(f=>f.id===id);}

// ── theme ─────────────────────────────────────────────────────────────────────
const isLight=()=>document.body.classList.contains('light');
function TH(){
  const L=isLight();
  return{
    paper:L?'#f6f8fa':'#161b22', plot:L?'#ffffff':'#0f1117',
    grid:L?'#eaeef2':'#21262d',  zero:L?'#d0d7de':'#30363d',
    text:L?'#24292f':'#c9d1d9',  axis:L?'#57606a':'#8b949e',
    line:L?'#d0d7de':'#30363d',
    legBg:L?'rgba(246,248,250,.9)':'rgba(22,27,34,.85)',
    legBd:L?'#d0d7de':'#30363d',
    rsBg:L?'#f0f2f4':'#0d1117',
    smGrid:L?'rgba(80,100,120,.25)':'rgba(110,130,150,.33)',
    smBd:L?'rgba(60,80,100,.6)':'rgba(160,180,200,.65)',
  };
}
function PC(){return isLight()
  ?{S11:'#0969da',S21:'#1a7f37',S12:'#bc4c00',S22:'#8250df'}
  :{S11:'#58a6ff',S21:'#3fb950',S12:'#f78166',S22:'#d2a8ff'};}
function MC(){return isLight()
  ?['#cf222e','#bc4c00','#bf8700','#1a7f37','#0969da','#8250df']
  :['#f85149','#ffa657','#e3b341','#7ee787','#79c0ff','#bf8ff8'];}

function toggleTheme(){
  document.body.classList.toggle('light');
  const lbl=isLight()?'Dark mode':'Light mode';
  document.querySelectorAll('[id^=tbtn-]').forEach(b=>b.textContent=lbl);
  localStorage.setItem('spv-theme',isLight()?'light':'dark');
  const mc=MC();
  S.files.forEach(fs=>{
    if(!fs.data)return;
    fs.mkrs.forEach((mk,i)=>{mk.color=mc[i%6];});
    renderAll(fs.id); renderMkrList(fs.id);
  });
}

// ── navigation ────────────────────────────────────────────────────────────────
function goTo(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  if(page==='viewer'){
    const f=S.files[S.active];
    if(f&&f.data) setTimeout(()=>{
      Plotly.Plots.resize(document.getElementById('md-'+f.id));
      Plotly.Plots.resize(document.getElementById('sc-'+f.id));
    },30);
  }
}

// ── tabs ──────────────────────────────────────────────────────────────────────
function renderTabs(){
  document.getElementById('tab-bar').innerHTML=S.files.map((f,i)=>
    `<div class="tab${i===S.active?' active':''}" onclick="setActiveTab(${i})">
      <span class="tab-name" title="${f.name}">${f.name}</span>
      <span class="tab-badge">${f.type.toUpperCase()}</span>
      <button class="tab-close" onclick="event.stopPropagation();closeTab(${i})" title="Close">&#x2715;</button>
    </div>`
  ).join('');
}

function setActiveTab(i){
  S.active=Math.max(0,Math.min(i,S.files.length-1));
  document.querySelectorAll('.tab-panel').forEach((p,j)=>p.classList.toggle('active',j===S.active));
  renderTabs();
  const f=S.files[S.active];
  if(f&&f.data) setTimeout(()=>{
    Plotly.Plots.resize(document.getElementById('md-'+f.id));
    Plotly.Plots.resize(document.getElementById('sc-'+f.id));
  },30);
}

function closeTab(i){
  const f=S.files[i];
  if(f){
    const md=document.getElementById('md-'+f.id),sc=document.getElementById('sc-'+f.id);
    if(md)Plotly.purge(md); if(sc)Plotly.purge(sc);
    const panel=document.getElementById('panel-'+f.id);
    if(panel)panel.remove();
  }
  S.files.splice(i,1);
  if(!S.files.length){goTo('landing');return;}
  S.active=Math.min(S.active,S.files.length-1);
  setActiveTab(S.active);
}

// ── parser ────────────────────────────────────────────────────────────────────
function parse(text,filename){
  const ext=filename.split('.').pop().toLowerCase();
  const ports=ext==='s1p'?1:ext==='s2p'?2:null;
  if(!ports)throw new Error('Use .s1p or .s2p file');
  let fu='GHZ',fmt='MA',z0=50;
  const tok=[];
  for(const raw of text.split(/\r?\n/)){
    const ln=raw.trim();
    if(!ln||ln[0]==='!')continue;
    if(ln[0]==='#'){
      const p=ln.slice(1).toUpperCase().trim().split(/\s+/);
      for(let i=0;i<p.length;i++){
        if(['HZ','KHZ','MHZ','GHZ'].includes(p[i]))fu=p[i];
        if(['MA','DB','RI'].includes(p[i]))fmt=p[i];
        if(p[i]==='R'&&p[i+1])z0=parseFloat(p[i+1]);
      }
      continue;
    }
    const d=ln.split('!')[0].trim();
    if(d)tok.push(...d.split(/\s+/).filter(Boolean));
  }
  const tpp=1+2*ports*ports,n=Math.floor(tok.length/tpp);
  if(n===0)throw new Error('No data points found');
  const freqs=[],sp={};
  const names=ports===1?['S11']:['S11','S21','S12','S22'];
  names.forEach(nm=>{sp[nm]={re:[],im:[],db:[]};});
  for(let i=0;i<n;i++){
    const b=i*tpp;
    freqs.push(toMHz(parseFloat(tok[b]),fu));
    names.forEach((nm,pi)=>{
      const a=parseFloat(tok[b+1+pi*2]),c=parseFloat(tok[b+2+pi*2]);
      const[re,im]=toCpx(a,c,fmt);
      sp[nm].re.push(re);sp[nm].im.push(im);
      sp[nm].db.push(20*Math.log10(Math.sqrt(re*re+im*im)||1e-15));
    });
  }
  return{freqs,sp,z0,fmt,ports,n};
}
function toMHz(f,u){return u==='HZ'?f/1e6:u==='KHZ'?f/1e3:u==='MHZ'?f:f*1e3;}
function toCpx(a,b,fmt){
  if(fmt==='RI')return[a,b];
  const m=fmt==='DB'?Math.pow(10,a/20):Math.abs(a),r=b*Math.PI/180;
  return[m*Math.cos(r),m*Math.sin(r)];
}
function fmtF(m){return m>=1000?(m/1000).toFixed(4)+' GHz':m>=1?m.toFixed(4)+' MHz':(m*1000).toFixed(4)+' kHz';}
function nearest(freqs,t){return freqs.reduce((b,f,i)=>Math.abs(f-t)<Math.abs(freqs[b]-t)?i:b,0);}

// ── Smith grid ────────────────────────────────────────────────────────────────
function smithGrid(){
  const th=TH(),N=400;
  const T=Array.from({length:N+1},(_,i)=>i*2*Math.PI/N);
  const trs=[];
  const add=(xs,ys,col,w)=>trs.push({x:xs,y:ys,mode:'lines',
    line:{color:col||th.smGrid,width:w||0.7},showlegend:false,hoverinfo:'skip'});
  add(T.map(t=>Math.cos(t)),T.map(t=>Math.sin(t)),th.smBd,1.3);
  add([-1,1],[0,0],th.smGrid,0.7);
  for(const R of[0.2,0.5,1,2,5]){
    const cx=R/(1+R),r=1/(1+R);
    const pts=T.map(t=>[cx+r*Math.cos(t),r*Math.sin(t)]).filter(([x,y])=>x*x+y*y<=1.001);
    if(pts.length)add(pts.map(p=>p[0]),pts.map(p=>p[1]));
  }
  for(const X of[0.2,0.5,1,2,5])for(const s of[1,-1]){
    const cy=1/(s*X),r=Math.abs(cy);
    const pts=T.map(t=>[1+r*Math.cos(t),cy+r*Math.sin(t)]).filter(([x,y])=>x*x+y*y<=1.001);
    if(pts.length)add(pts.map(p=>p[0]),pts.map(p=>p[1]));
  }
  return trs;
}
function smithAnno(th){
  const a=[];
  for(const[R,lbl]of[[0.2,'0.2'],[0.5,'0.5'],[1,'1'],[2,'2'],[5,'5']])
    a.push({x:R/(1+R),y:.07,text:lbl,showarrow:false,font:{size:9,color:th.smGrid},xanchor:'center'});
  a.push({x:-.97,y:.08,text:'SC',showarrow:false,font:{size:9,color:th.smGrid}});
  a.push({x:.93,y:.08,text:'OC',showarrow:false,font:{size:9,color:th.smGrid}});
  return a;
}

// ── visibility helper ─────────────────────────────────────────────────────────
function getVis(divId,names){
  const div=document.getElementById(divId);
  const vis={};names.forEach(nm=>{vis[nm]=true;});
  if(!div||!div.data)return vis;
  names.forEach((nm,i)=>{
    if(div.data[i]&&div.data[i].name===nm)vis[nm]=(div.data[i].visible!=='legendonly');
  });
  return vis;
}

// ── render magnitude ──────────────────────────────────────────────────────────
function renderMag(divId,data,mkrs,xr,yr){
  const th=TH(),pc=PC();
  const names=Object.keys(data.sp);
  const vis=getVis(divId,names);
  const traces=names.map(nm=>({
    x:data.freqs,y:data.sp[nm].db,name:nm,mode:'lines',
    line:{color:pc[nm]||'#aaa',width:1.9},
    visible:vis[nm]?true:'legendonly',
  }));
  const id=divId.replace('md-','');
  const fs=fileById(id);
  const shapes=[],annos=[];
  let rightY=0.97; // stacks right-side dB readouts downward
  mkrs.forEach((mk,i)=>{
    const idx=nearest(data.freqs,mk.freq);
    const mf=data.freqs[idx];
    const visNames=names.filter(nm=>vis[nm]);
    const mkName=mk.name||`M${i+1}`;

    // Vertical cursor line (optional)
    if(mk.showLine!==false)shapes.push({type:'line',x0:mf,x1:mf,y0:0,y1:1,yref:'paper',
      line:{color:mk.color,width:1.5,dash:'dash'}});

    // Dots + name label below topmost dot
    if(visNames.length){
      const yVals=visNames.map(nm=>data.sp[nm].db[idx]);
      const topI=yVals.reduce((mi,v,ci)=>v>yVals[mi]?ci:mi,0);
      const texts=yVals.map((_,j)=>j===topI?mkName:'');
      traces.push({
        x:visNames.map(()=>mf),y:yVals,
        mode:'markers+text',
        marker:{color:mk.color,size:10,line:{color:th.plot,width:1.8}},
        text:texts,textposition:'bottom center',
        textfont:{color:mk.color,size:14,...(fs?.axisFont?{family:fs.axisFont}:{})},
        showlegend:false,hoverinfo:'skip',
      });
    }

    // Right-side dB readout (below legend)
    if(visNames.length){
      const valText=[
        `<b>${mkName}</b>`,
        ...visNames.map(nm=>`<span style="color:${pc[nm]}">${nm}: ${data.sp[nm].db[idx].toFixed(2)} dB</span>`),
      ].join('<br>');
      annos.push({
        x:1.01,y:rightY,xref:'paper',yref:'paper',
        xanchor:'left',yanchor:'top',
        text:valText,showarrow:false,
        font:{size:10,color:mk.color},
        bgcolor:isLight()?'rgba(246,248,250,.92)':'rgba(13,17,23,.9)',
        bordercolor:mk.color,borderwidth:1,align:'left',
      });
      rightY-=(visNames.length+1)*0.065+0.015;
    }
  });
  const axFont=fs?.axisFont||'';
  const axSize=fs?.axisFontSize||null;
  const afTitle={color:th.axis,...(axFont?{family:axFont}:{}), ...(axSize?{size:axSize}:{})};
  const afTick={...(axFont?{family:axFont}:{}), ...(axSize?{size:axSize}:{})};
  const xax={title:{text:'Frequency (MHz)',font:afTitle},
    tickfont:Object.keys(afTick).length?afTick:undefined,
    gridcolor:th.grid,zerolinecolor:th.zero,color:th.axis,linecolor:th.line,
    rangeslider:{visible:true,bgcolor:th.rsBg,bordercolor:th.line,thickness:.07}};
  const yax={title:{text:'Magnitude (dB)',font:afTitle},
    tickfont:Object.keys(afTick).length?afTick:undefined,
    gridcolor:th.grid,zerolinecolor:th.zero,color:th.axis,linecolor:th.line};
  if(xr[0]!==null&&xr[1]!==null)xax.range=xr;
  if(yr[0]!==null&&yr[1]!==null)yax.range=yr;
  Plotly.react(divId,traces,{
    paper_bgcolor:th.paper,plot_bgcolor:th.plot,
    font:{color:th.text,size:11},margin:{t:20,r:160,b:80,l:58},
    xaxis:xax,yaxis:yax,shapes,annotations:annos,
    legend:{bgcolor:th.legBg,bordercolor:th.legBd,borderwidth:1},
    hovermode:'x unified',
  },{responsive:true,displayModeBar:true,
    modeBarButtonsToRemove:['select2d','lasso2d'],displaylogo:false});
}

// ── render Smith ──────────────────────────────────────────────────────────────
function renderSmith(divId,data,paramName,mkrs){
  const th=TH(),pc=PC();
  const s=data.sp[paramName];
  const trs=[...smithGrid()];
  trs.push({x:s.re,y:s.im,name:paramName,mode:'lines',
    line:{color:pc[paramName]||th.axis,width:2.2},
    hovertemplate:`${paramName}<br>Re: %{x:.4f}<br>Im: %{y:.4f}<extra></extra>`,
  });
  mkrs.forEach((mk,i)=>{
    const idx=nearest(data.freqs,mk.freq);
    const db=s.db[idx].toFixed(2);
    trs.push({x:[s.re[idx]],y:[s.im[idx]],mode:'markers+text',
      marker:{color:mk.color,size:12,symbol:'circle',line:{color:th.plot,width:1.8}},
      text:[mk.name||`M${i+1}`],textposition:'top right',textfont:{color:mk.color,size:10},
      showlegend:false,
      hovertemplate:`${mk.name||`M${i+1}`}: ${fmtF(data.freqs[idx])}<br>${paramName}: ${db} dB<br>Re: %{x:.4f}<br>Im: %{y:.4f}<extra></extra>`,
    });
  });
  Plotly.react(divId,trs,{
    paper_bgcolor:th.paper,plot_bgcolor:th.plot,
    font:{color:th.text,size:11},margin:{t:16,r:16,b:46,l:52},

      gridcolor:'transparent',zerolinecolor:'transparent',color:th.axis,linecolor:th.line},
    yaxis:{range:[-1.15,1.15],title:'Im(Γ)',
      gridcolor:'transparent',zerolinecolor:'transparent',color:th.axis,linecolor:th.line},
    annotations:smithAnno(th),showlegend:false,
  },{responsive:true,displayModeBar:false});
}

function renderAll(id){
  const fs=fileById(id); if(!fs||!fs.data)return;
  renderMag('md-'+id,fs.data,fs.mkrs,fs.xr,fs.yr);
  renderSmith('sc-'+id,fs.data,fs.type==='s1p'?'S11':fs.sp,fs.mkrs);
}

// ── markers ───────────────────────────────────────────────────────────────────
function addMkr(id){
  const fs=fileById(id); if(!fs||fs.mkrs.length>=6)return;
  const f=parseFloat(document.getElementById('mk-inp-'+id).value);
  if(isNaN(f))return;
  fs.mkrs.push({freq:f,color:MC()[fs.mkrs.length%6],name:`M${fs.mkrs.length+1}`,showLine:true});
  document.getElementById('mk-inp-'+id).value='';
  renderAll(id); renderMkrList(id);
}
function removeMkr(id,i){
  const fs=fileById(id); if(!fs)return;
  fs.mkrs.splice(i,1);
  const mc=MC(); fs.mkrs.forEach((mk,j)=>{mk.color=mc[j%6];});
  if(fs.activeMkr>=fs.mkrs.length)fs.activeMkr=Math.max(0,fs.mkrs.length-1);
  renderAll(id); renderMkrList(id);
}
function moveMkr(id,i,val){
  const fs=fileById(id); if(!fs)return;
  const f=parseFloat(val); if(isNaN(f)||!fs.mkrs[i])return;
  fs.mkrs[i].freq=f; renderAll(id); renderMkrList(id);
}
function setActiveMkr(id,i){
  const fs=fileById(id); if(!fs)return;
  fs.activeMkr=i; renderMkrList(id);
}
function changeMkrColor(id,i,color){
  const fs=fileById(id); if(!fs||!fs.mkrs[i])return;
  fs.mkrs[i].color=color; renderAll(id); renderMkrList(id);
}
function changeMkrName(id,i,name){
  const fs=fileById(id); if(!fs||!fs.mkrs[i])return;
  fs.mkrs[i].name=name.trim()||`M${i+1}`; renderAll(id); renderMkrList(id);
}
function toggleMkrLine(id,i){
  const fs=fileById(id); if(!fs||!fs.mkrs[i])return;
  fs.mkrs[i].showLine=fs.mkrs[i].showLine===false; renderAll(id); renderMkrList(id);
}
function renderMkrList(id){
  const fs=fileById(id); if(!fs)return;
  const el=document.getElementById('ml-'+id);
  if(!el)return;
  if(!fs.data||!fs.mkrs.length){el.innerHTML='';updateHint(id);return;}
  const names=Object.keys(fs.data.sp);
  const vis=getVis('md-'+id,names);
  const pc=PC();
  el.innerHTML=fs.mkrs.map((mk,i)=>{
    const idx=nearest(fs.data.freqs,mk.freq);
    const mf=fs.data.freqs[idx];
    const isAct=i===fs.activeMkr;
    const mkName=mk.name||`M${i+1}`;
    const lineOn=mk.showLine!==false;
    return `<div class="mkr-row${isAct?' active':''}" style="border-left-color:${mk.color}"
      onclick="setActiveMkr('${id}',${i})">
      <input type="color" class="mkr-color-inp" value="${mk.color}"
        onclick="event.stopPropagation()"
        onchange="changeMkrColor('${id}',${i},this.value)">
      <input type="text" class="mkr-name-inp" value="${mkName}"
        onclick="event.stopPropagation()"
        onkeydown="if(event.key==='Enter')this.blur()"
        onblur="changeMkrName('${id}',${i},this.value)">
      <input type="number" class="mkr-freq-inp" value="${mk.freq}" step="0.01"
        title="Edit and press Enter or click away to move"
        onkeydown="if(event.key==='Enter')this.blur()"
        onblur="moveMkr('${id}',${i},this.value)"
        onclick="event.stopPropagation()">
      <span class="mkr-unit">MHz</span>
      <span class="mkr-snap">&#8594;&nbsp;${fmtF(mf)}</span>
      <button class="mkr-cursor-btn${lineOn?' on':''}"
        onclick="event.stopPropagation();toggleMkrLine('${id}',${i})"
        title="Toggle cursor line">cursor</button>
      <button class="mkr-del" onclick="event.stopPropagation();removeMkr('${id}',${i})" title="Remove">&#x00D7;</button>
    </div>`;
  }).join('');
  updateHint(id);
}
function updateHint(id){
  const el=document.getElementById('hint-'+id); if(!el)return;
  const fs=fileById(id);
  el.textContent=fs&&fs.mkrs.length?'Drag a marker line to move it':'';
}

// ── drag markers on magnitude plot ────────────────────────────────────────────
function attachDragListener(id){
  const fs=fileById(id); if(!fs||fs._click)return;
  fs._click=true;
  const div=document.getElementById('md-'+id);
  let drag=null,rafId=null;

  function axInfo(){
    const l=div._fullLayout;
    if(!l||!l.xaxis||!l.xaxis._length||l.xaxis._offset==null||
       !l.yaxis||!l.yaxis._length||l.yaxis._offset==null)return null;
    return{xa:l.xaxis,ya:l.yaxis};
  }
  function pxToFreq(px,xa){const r=xa.range;return r[0]+(Math.max(0,Math.min(px,xa._length))/xa._length)*(r[1]-r[0]);}
  function freqToPx(freq,xa){const r=xa.range;return(freq-r[0])/(r[1]-r[0])*xa._length;}
  function clientPx(cx,xa){return cx-div.getBoundingClientRect().left-xa._offset;}
  function nearestMkr(px,xa){
    const THRESH=12,fs=fileById(id);
    let best=-1,bestD=Infinity;
    if(!fs||!fs.data)return best;
    fs.mkrs.forEach((mk,i)=>{
      const mf=fs.data.freqs[nearest(fs.data.freqs,mk.freq)];
      const d=Math.abs(px-freqToPx(mf,xa));
      if(d<THRESH&&d<bestD){best=i;bestD=d;}
    });
    return best;
  }

  div.addEventListener('mousedown',e=>{
    const fs=fileById(id); if(!fs||!fs.data||!fs.mkrs.length)return;
    const ax=axInfo(); if(!ax)return;
    const{xa,ya}=ax;
    const px=clientPx(e.clientX,xa);
    const py=e.clientY-div.getBoundingClientRect().top-ya._offset;
    if(px<0||px>xa._length||py<-5||py>ya._length+5)return;
    const mi=nearestMkr(px,xa); if(mi===-1)return;
    drag={idx:mi};
    if(fs.activeMkr!==mi){fs.activeMkr=mi;renderMkrList(id);}
    e.stopPropagation(); e.preventDefault();
  },true);

  div.addEventListener('mousemove',e=>{
    const ax=axInfo(); if(!ax)return;
    const{xa,ya}=ax;
    const px=clientPx(e.clientX,xa);
    const py=e.clientY-div.getBoundingClientRect().top-ya._offset;
    const inArea=px>=0&&px<=xa._length&&py>=-5&&py<=ya._length+5;
    if(!drag){
      const fs=fileById(id);
      div.style.cursor=inArea&&fs&&fs.data&&fs.mkrs.length&&nearestMkr(px,xa)!==-1?'ew-resize':'';
      return;
    }
    e.stopPropagation(); e.preventDefault();
    const freq=pxToFreq(px,xa);
    const fs=fileById(id); if(!fs)return;
    fs.mkrs[drag.idx].freq=freq;
    const inputs=document.querySelectorAll('#ml-'+id+' .mkr-freq-inp');
    if(inputs[drag.idx])inputs[drag.idx].value=freq.toFixed(4);
    if(rafId)cancelAnimationFrame(rafId);
    rafId=requestAnimationFrame(()=>{renderAll(id);rafId=null;});
  },true);

  const endDrag=()=>{
    if(!drag)return;
    drag=null; div.style.cursor='';
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    renderAll(id); renderMkrList(id);
  };
  div.addEventListener('mouseup',endDrag,true);
  document.addEventListener('mouseup',endDrag);
}

// ── Y sliders ─────────────────────────────────────────────────────────────────
function initSliders(id){
  const fs=fileById(id); if(!fs||!fs.data)return;
  const allDb=Object.values(fs.data.sp).flatMap(s=>s.db);
  const dMin=Math.min(...allDb),dMax=Math.max(...allDb);
  const pad=Math.max((dMax-dMin)*0.12,3);
  const sMin=Math.floor(dMin-pad*3),sMax=Math.ceil(dMax+pad);
  const lo=Math.floor(dMin-pad),hi=Math.ceil(dMax+pad);
  for(const k of['lo','hi']){
    const el=document.getElementById('yr-'+k+'-'+id);
    if(el){el.min=sMin;el.max=sMax;el.step=0.5;}
  }
  const loEl=document.getElementById('yr-lo-'+id),hiEl=document.getElementById('yr-hi-'+id);
  if(loEl)loEl.value=lo; if(hiEl)hiEl.value=hi;
  fs.yr=[lo,hi]; updateSliderLabels(id);
}
function updateSliderLabels(id){
  const lo=parseFloat(document.getElementById('yr-lo-'+id)?.value||0);
  const hi=parseFloat(document.getElementById('yr-hi-'+id)?.value||0);
  const lv=document.getElementById('yrv-lo-'+id),hv=document.getElementById('yrv-hi-'+id);
  if(lv)lv.textContent=lo.toFixed(1); if(hv)hv.textContent=hi.toFixed(1);
}
function setupSliders(id){
  const loEl=document.getElementById('yr-lo-'+id),hiEl=document.getElementById('yr-hi-'+id);
  if(!loEl||!hiEl)return;
  const chg=(which)=>()=>{
    let lo=parseFloat(loEl.value),hi=parseFloat(hiEl.value);
    if(lo>=hi){which==='lo'?loEl.value=hi-.5:hiEl.value=lo+.5;}
    lo=parseFloat(loEl.value); hi=parseFloat(hiEl.value);
    const fs=fileById(id); if(fs)fs.yr=[lo,hi];
    updateSliderLabels(id);
    Plotly.relayout('md-'+id,{'yaxis.range':[lo,hi]});
  };
  loEl.addEventListener('input',chg('lo'));
  hiEl.addEventListener('input',chg('hi'));
}
function resetY(id){
  const fs=fileById(id); if(!fs||!fs.data)return;
  initSliders(id); Plotly.relayout('md-'+id,{'yaxis.range':fs.yr});
}

// ── save ──────────────────────────────────────────────────────────────────────
async function savePlot(divId,filename){
  const isSmith=divId.startsWith('sc-');
  const div=document.getElementById(divId);
  if(!isSmith) await Plotly.relayout(div,{'xaxis.rangeslider.visible':false});
  await Plotly.downloadImage(div,{
    format:'png',filename,
    width:isSmith?660:1050,height:isSmith?660:540,
    scale:4,
  });
  if(!isSmith) await Plotly.relayout(div,{'xaxis.rangeslider.visible':true});
}

// ── load file ─────────────────────────────────────────────────────────────────
function loadFiles(fileList){
  Array.from(fileList).forEach(file=>{
    const ext=file.name.split('.').pop().toLowerCase();
    if(!['s1p','s2p'].includes(ext))return;
    const fs={
      id:'f'+(_fid++),name:file.name,type:ext,
      data:null,mkrs:[],activeMkr:0,xr:[null,null],yr:[null,null],
      _ev:false,_click:false,sp:'S11',axisFont:'',axisFontSize:null,
    };
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=parse(ev.target.result,file.name);
        fs.data=d;
        const panel=createPanel(fs);
        document.getElementById('tab-panels').appendChild(panel);
        const idx=S.files.length;
        S.files.push(fs);
        // fill info bar
        document.getElementById('iifmt-'+fs.id).textContent=d.fmt;
        document.getElementById('iin-'+fs.id).textContent=d.n;
        document.getElementById('iiz-'+fs.id).textContent=d.z0+' Ω';
        document.getElementById('iifr-'+fs.id).textContent=
          fmtF(Math.min(...d.freqs))+' – '+fmtF(Math.max(...d.freqs));
        // setup
        initSliders(fs.id); setupSliders(fs.id);
        renderAll(fs.id);
        // x-range tracking
        if(!fs._ev){
          fs._ev=true;
          document.getElementById('md-'+fs.id).on('plotly_relayout',e=>{
            if('xaxis.range[0]'in e)fs.xr=[e['xaxis.range[0]'],e['xaxis.range[1]']];
            else if(e['xaxis.autorange'])fs.xr=[null,null];
          });
        }
        attachDragListener(fs.id);
        document.getElementById('mk-inp-'+fs.id).addEventListener('keydown',e=>{
          if(e.key==='Enter')addMkr(fs.id);
        });
        // default marker
        fs.mkrs=[{freq:127.74,color:MC()[0],name:'M1',showLine:true}];
        renderAll(fs.id); renderMkrList(fs.id);
        // navigate & activate
        setActiveTab(idx);
        goTo('viewer');
        renderTabs();
      }catch(err){
        const eb=document.getElementById('eb-'+fs.id);
        if(eb){eb.textContent='Parse error: '+err.message;eb.classList.add('on');}
      }
    };
    r.readAsText(file);
  });
}

// ── wire up ───────────────────────────────────────────────────────────────────
// Landing drop zone
(()=>{
  const dz=document.getElementById('dz-landing'),fi=document.getElementById('fi-landing');
  dz.addEventListener('click',()=>fi.click());
  fi.addEventListener('change',e=>{loadFiles(e.target.files);fi.value='';});
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
  dz.addEventListener('drop',e=>{
    e.preventDefault();dz.classList.remove('drag-over');loadFiles(e.dataTransfer.files);
  });
})();

// Viewer "+ Add file" button
(()=>{
  const fi=document.getElementById('fi-add');
  fi.addEventListener('change',e=>{loadFiles(e.target.files);fi.value='';});
})();

// Drop files anywhere on viewer page
(()=>{
  const pv=document.getElementById('page-viewer');
  pv.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files'))e.preventDefault();});
  pv.addEventListener('drop',e=>{
    if(!e.dataTransfer.files.length)return;
    e.preventDefault(); loadFiles(e.dataTransfer.files);
  });
})();

// restore theme
if(localStorage.getItem('spv-theme')==='light'){
  document.body.classList.add('light');
  document.querySelectorAll('[id^=tbtn-]').forEach(b=>b.textContent='Dark mode');
}
</script>
</body>
</html>
